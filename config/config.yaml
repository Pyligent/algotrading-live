ibkr:
  host: "127.0.0.1"
  port: 7497       # paper trading default
  client_id: 1

universe:
  symbols: ["SPY", "QQQ","IWM"]
  primary_exchange: "SMART"
  currency: "USD"

data:
  bar_size: "5 mins"
  history_duration: "2 Y"
  storage_path: "./data"
  what_to_show: "TRADES"




strategy:
  name: "spy_qqq_ensemble"
  parameters:
    bar_timeframe: "5min"
    trend:
      ema_fast: 20
      ema_slow: 50
      breakout_lookback_bars: 12
      min_breakout_pct: 0.10        # ↓ from 0.18, less extension required
      atr_lookback: 14

      stop_distance_pct: 0.5
      take_profit_rr: 2.0
      # ATR-based stops (preferred); fallback to percent if stop_mode: "percent"
      stop_mode: "atr"              # "atr" or "percent"
      stop_atr_multiple: 1.5

      regime_atr_lookback: 14
      regime_min_atr_pct: 0.15      # ↓ from 0.25

    pullback:
      min_trend_bars: 6
      rsi_period: 14
      rsi_lower: 35
      rsi_upper: 55
    vwap:
      lookback_bars_slope: 10
      max_extension_pct: 0.5
    ensemble:
      min_votes_long: 1



risk:
  max_risk_per_trade_pct: 1.25
  max_daily_loss_pct: 2.0
  max_positions: 2
  trade_start_time: "09:35"
  trade_end_time: "15:50"
  emergency_flatten_on_exit: true
  holding:
    allow_overnight: false
    max_hold_minutes: 240
  intraday_kill_switch:
    enabled: true
    max_stops_per_day: 3
    max_intraday_loss_pct: 3.0
  stop_cooldown:
    enabled: true
    cooldown_bars: 3

backtest:
  initial_capital: 100000.0
  slippage_bps: 1
  commission_per_share: 0.005
  start_date: "2023-01-01"
  end_date: "2025-11-13"

live:
  paper_trading: true
  polling_interval_seconds: 30
  log_dir: "./logs"
  dry_run: false

# Machine learning meta-filter (optional)
ml:
  enabled: true
  model_path: "./models/spyqqq_meta.pkl"
  horizon_bars: 3           # bars ahead for label horizon
  target_move_pct: 0.1      # threshold (%) for "good" move label
  min_probability_long: 0.62
  log_only: false           # if true, log decisions but don't veto trades
  train_start_date: "2023-01-01"
  train_end_date: "2024-12-31"
  val_start_date: "2025-01-01"
  val_end_date: "2025-06-30"



# Per-symbol overrides (optional)
symbol_overrides:
  SPY:
    risk:
      max_risk_per_trade_pct: 1.0
      max_daily_loss_pct: 2.0
    ml:
      min_probability_long: 0.62
  QQQ:
    risk:
      max_risk_per_trade_pct: 0.5
      max_daily_loss_pct: 2.0
    ml:
      min_probability_long: 0.68
    trend:
      stop_atr_multiple: 1.2
  IWM:
    risk:
      max_risk_per_trade_pct: 0.8
      max_daily_loss_pct: 2.0
    ml:
      min_probability_long: 0.58
